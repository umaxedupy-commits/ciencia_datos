[project]
name = "curso-analisis-datos"
version = "0.1.0"
description = "Proyecto integrador del curso Programacion en Entornos de Datos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "dlt[duckdb]>=1.0",
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-dbt>=0.24",
    "dagster-webserver>=1.8",
    "psycopg2-binary",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = ["u1-entorno/tarea/ejercicio.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

# [tool.pytest.ini_options]
# testpaths = ["tests"]
# pythonpath = ["src", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["/"]

[tool.setuptools.packages.find]
include = ["ingesta*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
