name: 'minimarket_dbt'
version: '1.0.0'

profile: 'transformador'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transformador:
    staging:
      +materialized: table
      +schema: staging
      +group: ingesta 
    intermediate:
      +materialized: table
      +schema: intermediate
      +group: ingesta 
    marts:
      +materialized: table
      +schema: marts
      +group: ingesta 